version: '3.8'

services:
  # --- Data Tier ---
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_DATABASE: 'my_database'
      MYSQL_USER: 'user1'
      MYSQL_PASSWORD: '123456'
      MYSQL_ROOT_PASSWORD: 'rootpassword'
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  # --- App Tier ---
  flask_app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=user1
      - MYSQL_PASSWORD=123456
      - MYSQL_DB=my_database
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: